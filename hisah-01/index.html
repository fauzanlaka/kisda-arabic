<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مَنْ فَعَلَ؟ الحصة ١</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one centered "board" column; each round is a full card on a slate chalkboard, single dark look by choice */
:root {
  --board: #17302b; --board-2: #1f3d37; --chalk: #f3efe4; --chalk-dim: #b9c4bd;
  --saffron: #f2b544; --mint: #6fd3a8; --coral: #ef7a62; --line: #2f564e;
  --display: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", sans-serif;
  --text: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--board); color: var(--chalk); font-family: var(--text); direction: rtl;
  background-image: radial-gradient(circle at 20% 0%, #224740 0, transparent 55%), radial-gradient(circle at 90% 100%, #10251f 0, transparent 60%); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-size: clamp(30px, 7vw, 44px); margin: 0; line-height: 1.2; color: var(--saffron); }
.brand p { margin: 0; color: var(--chalk-dim); font-size: 18px; }
.hud { display: flex; gap: 8px; font-family: var(--display); }
.pill { border: 1px solid var(--line); background: var(--board-2); border-radius: 999px; padding: 6px 14px; font-size: 16px; white-space: nowrap; }
.pill b { color: var(--saffron); font-variant-numeric: tabular-nums; }
.card { background: var(--board-2); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-family: var(--display); color: var(--mint); font-size: 15px; letter-spacing: .02em; }
.prompt { font-size: clamp(22px, 5vw, 28px); line-height: 1.9; margin: 0; text-wrap: balance; }
.verb { font-size: clamp(54px, 15vw, 88px); font-weight: 700; text-align: center; line-height: 1.6; color: var(--chalk);
  text-shadow: 0 0 18px rgba(243,239,228,.15); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 3px dashed var(--saffron); color: var(--saffron); text-align: center; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
.opt { background: var(--board); border: 2px solid var(--line); border-radius: 14px; padding: 12px 10px; font-size: clamp(24px, 6vw, 30px);
  line-height: 1.7; transition: transform .12s, border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--saffron); transform: translateY(-2px); }
.opt:focus-visible, .btn:focus-visible, .tile:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.opt.ok { background: #1d4a3a; border-color: var(--mint); }
.opt.bad { background: #4a2620; border-color: var(--coral); }
.opt:disabled { cursor: default; }
.timer { height: 8px; border-radius: 99px; background: var(--board); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--coral), var(--saffron)); transform-origin: right; }
.timer.hurry i { background: var(--coral); animation: hurry .5s ease-in-out infinite alternate; }
@keyframes hurry { to { opacity: .45; } }
.snd { cursor: pointer; color: var(--chalk); display: inline-flex; align-items: center; padding: 6px 10px; }
.snd svg { width: 20px; height: 20px; }
.snd[aria-pressed="false"] { color: var(--chalk-dim); }
.feedback { min-height: 2.2em; font-size: 21px; line-height: 1.8; }
.feedback.ok { color: var(--mint); } .feedback.bad { color: var(--coral); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.btn { font-family: var(--display); font-size: 18px; border-radius: 12px; padding: 10px 22px; border: 0; background: var(--saffron); color: #1b1608; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--chalk); border: 1px solid var(--line); font-weight: 500; }
.rounds { display: grid; gap: 10px; }
.round { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--board); border: 1px solid var(--line); }
.round .n { font-family: var(--display); width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--saffron); color: #1b1608; font-size: 20px; }
.round h3 { margin: 0; font-family: var(--display); font-size: 19px; }
.round p { margin: 0; color: var(--chalk-dim); font-size: 18px; }
.tray, .answer { display: flex; flex-wrap: wrap; gap: 10px; min-height: 70px; padding: 10px; border-radius: 12px; }
.answer { border: 2px dashed var(--line); background: var(--board); }
.tile { background: var(--chalk); color: #1b2a26; border: 0; border-radius: 10px; padding: 4px 14px; font-size: 26px; line-height: 1.7; font-weight: 700; }
.answer .tile { background: var(--saffron); }
.progress { display: flex; gap: 4px; }
.progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--mint); } .progress span.miss { background: var(--coral); } .progress span.now { background: var(--saffron); }
.big { font-family: var(--display); font-size: clamp(48px, 14vw, 72px); color: var(--saffron); text-align: center; margin: 0; font-variant-numeric: tabular-nums; }
.stars { text-align: center; font-size: 40px; letter-spacing: 8px; color: var(--saffron); }
.review { display: grid; gap: 8px; }
.review div { background: var(--board); border-radius: 10px; padding: 8px 12px; font-size: 20px; line-height: 1.8; border-right: 4px solid var(--coral); }
.review em { color: var(--mint); font-style: normal; font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 20px; min-width: 520px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; line-height: 1.8; }
th { font-family: var(--display); font-size: 15px; color: var(--mint); font-weight: 500; }
td b { color: var(--saffron); }
label { font-family: var(--display); font-size: 16px; color: var(--chalk-dim); }
input[type=text] { font: inherit; font-size: 22px; width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--board); color: var(--chalk); }
@media (max-width: 420px) { .card { padding: 16px; } .opts { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.card.enter { animation: pop .25s ease-out; }
.credit { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.credit img { width: 56px; height: 56px; border-radius: 50%; flex: none; }
.credit .ph { border: 2px solid var(--saffron); }
.credit b { display: block; font-family: var(--display); color: var(--saffron); font-size: 18px; font-weight: 700; }
.credit span { display: block; color: var(--chalk-dim); font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .04em; direction: ltr; text-align: center; }
</style>

<script>
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);

// [ف، ع، ل، حركة العين]
const VERBS = { 'كتب': ['ك','ت','ب','َ'], 'ذهب': ['ذ','ه','ب','َ'], 'دخل': ['د','خ','ل','َ'], 'خرج': ['خ','ر','ج','َ'],
  'جلس': ['ج','ل','س','َ'], 'حضر': ['ح','ض','ر','َ'], 'درس': ['د','ر','س','َ'], 'وصل': ['و','ص','ل','َ'],
  'شرب': ['ش','ر','ب','ِ'], 'فهم': ['ف','ه','م','ِ'], 'حفظ': ['ح','ف','ظ','ِ'], 'سمع': ['س','م','ع','ِ'] };
const PRON = [
  ['هو', 'هُوَ', 'َ'], ['هما', 'هُمَا (لِلْمُذَكَّرِ)', 'َا'], ['هم', 'هُمْ', 'ُوا'],
  ['هي', 'هِيَ', 'َتْ'], ['هماf', 'هُمَا (لِلْمُؤَنَّثِ)', 'َتَا'], ['هن', 'هُنَّ', 'ْنَ'],

  ['أنتِ', 'أَنْتِ', 'ْتِ'], ['أنتن', 'أَنْتُنَّ', 'ْتُنَّ'], ['أنا', 'أَنَا', 'ْتُ'], ['نحن', 'نَحْنُ', 'ْنَا'] ];
const P = Object.fromEntries(PRON.map(p => [p[0], p]));
const form = (v, k) => { const [f, a, l, m] = VERBS[v]; return f + 'َ' + a + m + l + P[k][2]; };
const bare = v => form(v, 'هو');

const SENT = [
  ['الطَّالِبَاتُ ___ إِلَى القَاعَةِ.', 'دخل', 'هن'], ['يَا مُحَمَّدُ، هَلْ ___ الدَّرْسَ؟', 'فهم', 'أنتَ'],
  ['نَحْنُ ___ المُحَاضَرَةَ صَبَاحًا.', 'حضر', 'نحن'], ['يَا فَاطِمَةُ، مَتَى ___ إِلَى الجَامِعَةِ؟', 'وصل', 'أنتِ'],
  ['عَلِيٌّ وَعُمَرُ ___ إِلَى المَكْتَبَةِ.', 'ذهب', 'هما'], ['أَيُّهَا الطُّلَّابُ، هَلْ ___ الوَاجِبَ؟', 'كتب', 'أنتم'],
  ['يَا طَالِبَاتُ، أَيْنَ ___ أَمْسِ؟', 'جلس', 'أنتن'], ['زَيْنَبُ وَمَرْيَمُ ___ مِنَ المَقْصِفِ.', 'خرج', 'هماf'],
  ['أَنَا ___ القُرْآنَ فِي المَعْهَدِ.', 'حفظ', 'أنا'], ['الطُّلَّابُ ___ الشَّايَ فِي المَقْصِفِ.', 'شرب', 'هم'],
  ['فَاطِمَةُ ___ النَّحْوَ فِي المَعْهَدِ.', 'درس', 'هي'], ['يَا أَحْمَدُ وَيَا يُوسُفُ، هَلْ ___ الحِوَارَ؟', 'سمع', 'أنتما'],
  ['الأُسْتَاذُ ___ إِلَى القَاعَةِ.', 'دخل', 'هو'] ];
const ORDER = [
  [['وَصَلْنَا', 'إِلَى', 'الجَامِعَةِ', 'أَمْسِ'], ['أَمْسِ وَصَلْنَا إِلَى الجَامِعَةِ']],
  [['هَلْ', 'حَضَرْتُمُ', 'المُحَاضَرَةَ', 'الأُولَى؟'], []],
  [['فِي', 'أَيِّ', 'كُلِّيَّةٍ', 'أَنْتَ؟'], []],
  [['تَعَرَّفْتُ', 'عَلَى', 'زَمِيلٍ', 'جَدِيدٍ'], []],
  [['لَا،', 'مَا', 'كَتَبْتُ', 'الوَاجِبَ'], []] ];

const ROUNDS = [
  { name: 'مَنْ فَعَلَ؟', desc: 'انْظُرْ إِلَى الفِعْلِ وَاخْتَرِ الضَّمِيرَ المُنَاسِبَ.', n: 8 },
  { name: 'أَكْمِلِ الجُمْلَةَ', desc: 'اخْتَرْ صُورَةَ الفِعْلِ الصَّحِيحَةَ لِلْجُمْلَةِ.', n: 8 },
  { name: 'رَتِّبِ الجُمْلَةَ', desc: 'الْمِسِ الكَلِمَاتِ بِالتَّرْتِيبِ الصَّحِيحِ.', n: 5 } ];
const TIME = 20;

// Countdown sounds (Web Audio, no files): a soft tick each second, sharper rising ticks in the last 5 seconds, a low buzz at time-up.
const SND = { ctx: null, on: true };
try { SND.on = localStorage.getItem('snd') !== 'off'; } catch (e) {}
function audioReady() {
  if (!SND.ctx) { try { SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function beep(freq, dur, vol, type = 'sine', delay = 0) {
  if (!SND.on) return;
  const ctx = audioReady(); if (!ctx) return;
  const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const tick = sec => sec <= 5 ? beep(660 + (5 - sec) * 110, 0.09, 0.2, 'square') : beep(1250, 0.03, 0.06);
const buzz = () => beep(140, 0.5, 0.22, 'sawtooth');
const melody = (notes, step, dur, vol, type = 'triangle') => notes.forEach((f, i) => beep(f, dur, vol, type, i * step));
// Button and result sounds, each matched to what the action means.
const FX = {
  nav: () => beep(520, 0.05, 0.1, 'triangle'),                         // table, back, home, verb picker
  next: () => melody([600, 900], 0.06, 0.07, 0.12),                    // next question
  start: () => melody([523, 659, 784, 1047], 0.09, 0.12, 0.15),        // start / play again
  ok: () => melody([784, 1175], 0.09, 0.18, 0.18, 'sine'),             // correct answer
  bad: () => melody([220, 165], 0.12, 0.22, 0.16, 'square'),           // wrong answer
  bonus: () => melody([1319, 1568, 2093], 0.07, 0.1, 0.12, 'sine'),    // streak bonus
  tile: () => beep(1400, 0.04, 0.12, 'triangle'),                      // word tile placed
  untile: () => beep(900, 0.04, 0.1, 'triangle'),                      // word tile taken back
  win: s => s >= 2 ? melody([523, 659, 784, 1047, 1319], 0.11, 0.18, 0.16) : melody([523, 659, 784], 0.13, 0.2, 0.14),
};
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || b.id === 'snd' || b.classList.contains('opt')) return;  // answers sound in judge()
  if (b.classList.contains('tile')) return (b.closest('#ans') ? FX.untile : FX.tile)();
  if (b.id === 'go' || b.id === 'again') return FX.start();
  if (b.id === 'nx') return FX.next();
  FX.nav();
}, true);
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function soundButton() {
  const b = document.getElementById('snd');
  b.innerHTML = SND.on ? ICON_ON : ICON_OFF;
  b.setAttribute('aria-pressed', String(SND.on));
  b.title = SND.on ? 'إِيقَافُ الصَّوْتِ' : 'تَشْغِيلُ الصَّوْتِ';
}
document.getElementById('snd').onclick = () => {
  SND.on = !SND.on;
  try { localStorage.setItem('snd', SND.on ? 'on' : 'off'); } catch (e) {}
  if (SND.on) beep(880, 0.08, 0.15);
  soundButton();
};
soundButton();

let S;
const stage = document.getElementById('stage');
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };

function hud() { document.getElementById('score').textContent = AR(S ? S.score : 0); document.getElementById('streak').textContent = AR(S ? S.streak : 0); }

function buildQuestions() {
  const qs = [];
  const keys = pick(PRON.map(p => p[0]), 8);
  keys.forEach(k => {
    const v = pick(Object.keys(VERBS), 1)[0], f = form(v, k);
    const others = shuffle(PRON.map(p => p[0]).filter(x => x !== k && form(v, x) !== f)).slice(0, 3);
    qs.push({ r: 0, v, k, show: f, opts: shuffle([k, ...others]).map(x => ({ id: x, label: P[x][1] })), ans: k,
      fix: `«${f}» تَصْرِيفُهُ مَعَ «${P[k][1]}».` });
  });
  pick(SENT, 8).forEach(([s, v, k]) => {
    const near = { 'هو': ['هي', 'هم', 'أنتَ'], 'هما': ['هماf', 'هم', 'هو'], 'هم': ['هما', 'أنتم', 'هن'], 'هي': ['هو', 'هماf', 'أنتِ'],
      'هماf': ['هما', 'هن', 'هي'], 'هن': ['هم', 'أنتن', 'نحن'], 'أنتَ': ['أنتِ', 'أنا', 'هو'], 'أنتما': ['أنتم', 'هما', 'أنتن'],
      'أنتم': ['أنتن', 'هم', 'أنتما'], 'أنتِ': ['أنتَ', 'أنا', 'هي'], 'أنتن': ['أنتم', 'هن', 'أنتِ'], 'أنا': ['أنتَ', 'نحن', 'أنتِ'], 'نحن': ['هن', 'أنا', 'أنتم'] }[k];
    const forms = [...new Set([form(v, k), ...near.map(x => form(v, x))])].slice(0, 4);
    qs.push({ r: 1, sent: s, v, k, opts: shuffle(forms).map(x => ({ id: x, label: x })), ans: form(v, k),
      fix: `الفَاعِلُ «${P[k][1]}» ← ${s.replace('___', form(v, k))}` });
  });
  shuffle(ORDER).forEach(([w, alts]) => qs.push({ r: 2, words: w, accept: [w.join(' '), ...alts], fix: w.join(' ') }));
  return qs;
}

function start() {
  audioReady();
  S = { qs: buildQuestions(), i: 0, score: 0, streak: 0, best: 0, right: 0, log: [], name: (document.getElementById('nm') || {}).value || '' };
  hud(); next();
}

function home() {
  S = null; hud();
  stage.replaceChildren($(`<section class="card enter">
    <div class="eyebrow">لُعْبَةُ مُرَاجَعَةٍ • ثَلَاثُ جَوْلَاتٍ • ${AR(21)} سُؤَالًا</div>
    <p class="prompt">هَلْ تَسْتَطِيعُ أَنْ تَعْرِفَ الفَاعِلَ مِنْ آخِرِ الفِعْلِ؟ أَجِبْ بِسُرْعَةٍ لِتَجْمَعَ نِقَاطًا أَكْثَرَ.</p>
    <div class="rounds">${ROUNDS.map((r, i) => `<div class="round"><span class="n">${AR(i + 1)}</span><div><h3>${r.name}</h3><p>${r.desc}</p></div></div>`).join('')}</div>
    <div><label for="nm">اسْمُكَ (اخْتِيَارِيٌّ)</label><input id="nm" type="text" autocomplete="off" placeholder="مَثَلًا: أَحْمَدُ"></div>
    <div class="row"><button class="btn" id="go">ابْدَأِ اللُّعْبَةَ</button><button class="btn ghost" id="tbl">جَدْوَلُ التَّصْرِيفِ</button></div>
  </section>`));
  document.getElementById('go').onclick = start;
  document.getElementById('tbl').onclick = () => table(home);
}

function table(back, v = 'كتب') {
  const cols = [['هو', 'هي', 'أنتَ', 'أنتِ', 'أنا'], ['هما', 'هماf', 'أنتما', 'أنتما', 'نحن'], ['هم', 'هن', 'أنتم', 'أنتن', 'نحن']];
  const rows = ['المُفْرَدُ', 'المُثَنَّى', 'الجَمْعُ'];
  stage.replaceChildren($(`<section class="card enter">
    <div class="eyebrow">جَدْوَلُ تَصْرِيفِ الفِعْلِ المَاضِي</div>
    <div class="row" style="justify-content:flex-start">${Object.keys(VERBS).slice(0, 6).map(x => `<button class="btn ghost" data-v="${x}">${bare(x)}</button>`).join('')}</div>
    <div class="tbl-wrap"><table><tr><th></th><th>الغَائِبُ</th><th>الغَائِبَةُ</th><th>المُخَاطَبُ</th><th>المُخَاطَبَةُ</th><th>المُتَكَلِّمُ</th></tr>
    ${cols.map((c, i) => `<tr><th>${rows[i]}</th>${c.map(k => `<td>${P[k][1].split(' ')[0]} <b>${form(v, k)}</b></td>`).join('')}</tr>`).join('')}</table></div>
    <div class="row"><button class="btn" id="bk">رُجُوعٌ</button></div></section>`));
  stage.querySelectorAll('[data-v]').forEach(b => b.onclick = () => table(back, b.dataset.v));
  document.getElementById('bk').onclick = back;
}

let timerId, t0;
function progressBar() {
  return `<div class="progress">${S.qs.map((q, i) => `<span class="${i < S.i ? (S.log[i] ? 'done' : 'miss') : i === S.i ? 'now' : ''}"></span>`).join('')}</div>`;
}

function next() {
  clearInterval(timerId);
  if (S.i >= S.qs.length) return finish();
  const q = S.qs[S.i], R = ROUNDS[q.r];
  const nInRound = S.qs.slice(0, S.i).filter(x => x.r === q.r).length + 1;
  let body;
  if (q.r === 0) body = `<p class="prompt">مَنْ فَعَلَ؟</p><div class="verb">${q.show}</div>`;
  else if (q.r === 1) body = `<p class="prompt">${q.sent.replace('___', '<span class="blank">؟</span>')}</p><div class="eyebrow">الفِعْلُ: ${bare(q.v)}</div>`;
  else body = `<div class="answer" id="ans" aria-label="جُمْلَتُكَ"></div><div class="tray" id="tray"></div>`;
  const card = $(`<section class="card enter">
    ${progressBar()}
    <div class="eyebrow">الجَوْلَةُ ${AR(q.r + 1)}: ${R.name} • ${AR(nInRound)} / ${AR(R.n)}</div>
    ${q.r < 2 ? '<div class="timer"><i id="bar"></i></div>' : ''}
    ${body}
    ${q.r < 2 ? `<div class="opts">${q.opts.map(o => `<button class="opt" data-id="${o.id}">${o.label}</button>`).join('')}</div>` : ''}
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn ghost" id="tbl">الجَدْوَلُ</button><button class="btn" id="nx" hidden>التَّالِي ←</button></div>
  </section>`);
  stage.replaceChildren(card);
  card.querySelector('#tbl').onclick = () => { clearInterval(timerId); table(() => { S.i; next(); }, q.v || 'كتب'); };
  card.querySelector('#nx').onclick = () => { S.i++; next(); };
  if (q.r < 2) {
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.id));
    t0 = Date.now();
    const bar = card.querySelector('#bar');
    let lastSec = TIME;
    timerId = setInterval(() => {
      const left = Math.max(0, 1 - (Date.now() - t0) / (TIME * 1000)), sec = Math.ceil(left * TIME);
      bar.style.transform = `scaleX(${left})`;
      bar.parentElement.classList.toggle('hurry', sec <= 5);
      if (sec < lastSec && sec > 0) { lastSec = sec; tick(sec); }
      if (!left) { buzz(); answer(null); }
    }, 100);
  } else orderSetup(q, card);
}

function judge(ok, fixHtml, pts, timedOut = false) {
  clearInterval(timerId);
  document.querySelector('.timer')?.classList.remove('hurry');
  S.log[S.i] = ok;
  if (ok) { S.streak++; S.right++; S.best = Math.max(S.best, S.streak); S.score += pts + (S.streak >= 3 ? 20 : 0); }
  else { S.streak = 0; S.miss = (S.miss || []); S.miss.push(fixHtml); }
  if (ok) { FX.ok(); if (S.streak >= 3) setTimeout(FX.bonus, 260); } else if (!timedOut) FX.bad();
  hud();
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = ok ? (S.streak >= 3 ? `أَحْسَنْتَ! +${AR(pts)} وَمُكَافَأَةُ التَّتَابُعِ +${AR(20)}` : `أَحْسَنْتَ! +${AR(pts)}`) : 'الصَّوَابُ: ' + fixHtml;
  const nx = document.getElementById('nx'); nx.hidden = false; nx.focus();
}

function answer(id) {
  const q = S.qs[S.i];
  if (S.log[S.i] !== undefined) return;
  const secs = (Date.now() - t0) / 1000;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.id === q.ans) b.classList.add('ok'); else if (b.dataset.id === id) b.classList.add('bad'); });
  const ok = id === q.ans;
  judge(ok, id === null ? 'انْتَهَى الوَقْتُ. ' + q.fix : q.fix, 100 + Math.round(50 * Math.max(0, 1 - secs / TIME)), id === null);
}

function orderSetup(q, card) {
  const tray = card.querySelector('#tray'), ans = card.querySelector('#ans');
  let words = shuffle(q.words); if (words.join(' ') === q.words.join(' ')) words = words.reverse();
  const chosen = [];
  const draw = () => {
    tray.replaceChildren(...words.map((w, i) => { const b = $(`<button class="tile">${w}</button>`); b.onclick = () => { chosen.push(w); words.splice(i, 1); draw(); }; return b; }));
    ans.replaceChildren(...chosen.map((w, i) => { const b = $(`<button class="tile">${w}</button>`); b.onclick = () => { if (S.log[S.i] !== undefined) return; words.push(w); chosen.splice(i, 1); draw(); }; return b; }));
    if (!words.length && S.log[S.i] === undefined) {
      const ok = q.accept.includes(chosen.join(' '));
      judge(ok, q.fix, 150);
      tray.replaceChildren();
    }
  };
  draw();
}

function finish() {
  const total = S.qs.length, pct = S.right / total;
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  FX.win(stars);
  const msg = ['رَاجِعِ الجَدْوَلَ ثُمَّ حَاوِلْ مَرَّةً أُخْرَى.', 'بِدَايَةٌ طَيِّبَةٌ، وَاصِلِ التَّدْرِيبَ.', 'جَيِّدٌ جِدًّا!', 'مُمْتَازٌ! أَنْتَ بَطَلُ التَّصْرِيفِ.'][stars];
  stage.replaceChildren($(`<section class="card enter">
    <div class="eyebrow">النَّتِيجَةُ${S.name ? ' • ' + S.name.replace(/[<>&]/g, '') : ''}</div>
    <p class="big">${AR(S.score)}</p>
    <div class="stars" aria-label="${AR(stars)} نُجُومٍ">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p class="prompt" style="text-align:center">${msg}<br>الإِجَابَاتُ الصَّحِيحَةُ: ${AR(S.right)} مِنْ ${AR(total)} • أَطْوَلُ تَتَابُعٍ: ${AR(S.best)}</p>
    ${S.miss && S.miss.length ? `<div class="eyebrow">رَاجِعْ هٰذِهِ الأَخْطَاءَ</div><div class="review">${S.miss.map(m => `<div>${m}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn" id="again">الْعَبْ مَرَّةً أُخْرَى</button><button class="btn ghost" id="hm">الصَّفْحَةُ الرَّئِيسَةُ</button></div>
  </section>`));
  document.getElementById('again').onclick = start;
  document.getElementById('hm').onclick = home;
}
home();
</script>
