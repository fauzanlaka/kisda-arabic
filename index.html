<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أَلْعَابُ اللُّغَةِ العَرَبِيَّةِ الاتِّصَالِيَّةِ • KISDA</title>
<meta name="description" content="ألعاب مراجعة لمادة اللغة العربية الاتصالية – حصة بعد حصة. إعداد الأستاذ أشعري، KISDA.">
<link rel="icon" href="assets/kisda.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root {
  --board: #17302b; --board-2: #1f3d37; --chalk: #f3efe4; --chalk-dim: #b9c4bd;
  --saffron: #f2b544; --mint: #6fd3a8; --line: #2f564e;
  --display: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", sans-serif;
  --text: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--board); color: var(--chalk); font-family: var(--text);
  background-image: radial-gradient(circle at 20% 0%, #224740 0, transparent 55%), radial-gradient(circle at 90% 100%, #10251f 0, transparent 60%); }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
header img { width: 64px; height: 64px; border-radius: 50%; flex: none; }
header h1 { margin: 0; font-family: var(--display); color: var(--saffron); font-size: clamp(26px, 5.5vw, 40px); line-height: 1.25; }
header p { margin: 2px 0 0; color: var(--chalk-dim); font-size: 19px; }
.intro { font-size: clamp(19px, 4.4vw, 23px); line-height: 1.9; margin: 22px 0 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; }
.lesson { display: flex; gap: 14px; align-items: flex-start; height: 100%; padding: 16px; border-radius: 16px; background: var(--board-2);
  border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .12s, border-color .12s; }
a.lesson:hover { transform: translateY(-2px); border-color: var(--saffron); }
a.lesson:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.n { font-family: var(--display); width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--saffron); color: #1b1608; font-size: 22px; font-weight: 700; }
.lesson h2 { margin: 0; font-family: var(--display); font-size: 20px; line-height: 1.5; }
.lesson p { margin: 4px 0 0; color: var(--chalk-dim); font-size: 18px; line-height: 1.7; }
.tag { display: inline-block; margin-top: 8px; font-family: var(--display); font-size: 15px; border-radius: 999px; padding: 3px 12px; }
a.lesson .tag { background: var(--mint); color: #10251f; font-weight: 700; }
.soon { opacity: .55; }
.soon .n { background: var(--line); color: var(--chalk); }
.soon .tag { border: 1px solid var(--line); color: var(--chalk-dim); }
footer { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
footer img { width: 56px; height: 56px; border-radius: 50%; }
footer .ph { border: 2px solid var(--saffron); }
footer b { display: block; font-family: var(--display); color: var(--saffron); font-size: 18px; }
footer span { display: block; color: var(--chalk-dim); font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .04em; direction: ltr; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/kisda.png" alt="KISDA">
    <div>
      <h1>أَلْعَابُ اللُّغَةِ العَرَبِيَّةِ الاتِّصَالِيَّةِ</h1>
      <p>الفَصْلُ الدِّرَاسِيُّ الثَّانِي • ثَلَاثَ عَشْرَةَ حِصَّةً</p>
    </div>
  </header>
  <p class="intro">اخْتَرْ حِصَّتَكَ، وَرَاجِعْ قَاعِدَتَهَا بِلُعْبَةٍ قَصِيرَةٍ بَعْدَ الدَّرْسِ.</p>
  <ul class="grid" id="lessons"></ul>
  <footer>
    <img class="ph" src="assets/ustaz.png" alt="الأُسْتَاذُ أَشْعَرِي">
    <div><b>إِعْدَادُ: الأُسْتَاذُ أَشْعَرِي</b><span>Ustaz Asyari  •  KISDA</span></div>
    <img src="assets/kisda.png" alt="KISDA">
  </footer>
</div>
<script src="lessons.js"></script>
<script>
// Lesson list (topic, grammar point); lessons.js lists which ones have a game folder.
const LESSONS = [
  ['التَّعَارُفُ فِي الحَرَمِ الجَامِعِيِّ', 'تَصْرِيفُ الفِعْلِ المَاضِي مَعَ جَمِيعِ الضَّمَائِرِ'],
  ['يَوْمِي فِي الجَامِعَةِ', 'الفِعْلُ المُضَارِعُ + السَّاعَةُ'],
  ['فِي المَكْتَبَةِ', 'فِعْلُ الأَمْرِ + «لَا» النَّاهِيَةُ'],
  ['فِي مَقْصِفِ الجَامِعَةِ', 'الأَعْدَادُ ١–١٠ (التَّذْكِيرُ وَالتَّأْنِيثُ)'],
  ['فِي السُّوقِ', 'الأَعْدَادُ ١١–١٠٠ + التَّمْيِيزُ'],
  ['أُسْرَتِي وَأَقَارِبِي', 'المُثَنَّى + الأَسْمَاءُ الخَمْسَةُ'],
  ['مُرَاجَعَةٌ وَتَقْيِيمٌ شَفَوِيٌّ', 'مُرَاجَعَةُ قَوَاعِدِ الحِصَصِ ١–٦'],
  ['السَّفَرُ وَالمُوَاصَلَاتُ', 'السِّينُ وَسَوْفَ وَلَنْ + المُضَارِعُ'],
  ['عِنْدَ الطَّبِيبِ', 'لَمْ + المُضَارِعُ المَجْزُومُ'],
  ['الطَّقْسُ وَفُصُولُ السَّنَةِ', 'كَانَ وَأَخَوَاتُهَا، لَيْسَ'],
  ['الهِوَايَاتُ وَأَوْقَاتُ الفَرَاغِ', 'اسْمُ التَّفْضِيلِ (أَفْعَلُ مِنْ)'],
  ['المُنَاسَبَاتُ وَالأَعْيَادُ', 'الأَعْدَادُ التَّرْتِيبِيَّةُ + التَّارِيخُ'],
  ['المَشْرُوعُ النِّهَائِيُّ', 'مُرَاجَعَةٌ شَامِلَةٌ'],
];
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const ready = new Set(window.READY || []);
document.getElementById('lessons').innerHTML = LESSONS.map(([topic, rule], i) => {
  const n = i + 1, slug = 'hisah-' + String(n).padStart(2, '0') + '/';
  const inner = `<span class="n">${AR(n)}</span><div><h2>${topic}</h2><p>${rule}</p>` +
    `<span class="tag">${ready.has(n) ? 'الْعَبِ الآنَ ←' : 'قَرِيبًا'}</span></div>`;
  return ready.has(n) ? `<li><a class="lesson" href="${slug}">${inner}</a></li>` : `<li><div class="lesson soon" aria-disabled="true">${inner}</div></li>`;
}).join('');
</script>
</body>
</html>
